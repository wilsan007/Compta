<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Onusuite">
  <title>Onusuite</title>
  <!-- Onusuite mark: 3x3 modular grid, centre removed = a modular "O" (17 modules unified) -->
  <rect width="48" height="48" rx="10" fill="#C44536"/>
  <g fill="#F5F0E8">
    <rect x="4"  y="4"  width="12" height="12" rx="3"/>
    <rect x="18" y="4"  width="12" height="12" rx="3"/>
    <rect x="32" y="4"  width="12" height="12" rx="3"/>
    <rect x="4"  y="18" width="12" height="12" rx="3"/>
    <rect x="32" y="18" width="12" height="12" rx="3"/>
    <rect x="4"  y="32" width="12" height="12" rx="3"/>
    <rect x="18" y="32" width="12" height="12" rx="3"/>
    <rect x="32" y="32" width="12" height="12" rx="3"/>
  </g>
</svg>
