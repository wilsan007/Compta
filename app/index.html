<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C44536" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Onusuite" />
    <meta name="description" content="Onusuite — The Unified Business Suite. Suite logicielle trilingue (FR/EN/AR) pour PME: comptabilité, commercial, RH/paie, trésorerie, stock et plus." />

    <!-- SEO: The SPA dashboard is not for public indexing. Landing pages in /public/ are indexable. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />

    <!-- SECURITY: frame-ancestors must be set via HTTP headers, not meta tags -->

    <!-- SECURITY: Prevent MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- SECURITY: Control referrer information leakage -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SECURITY: Disable browser features that could be exploited -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" />

    <title>Onusuite — The Unified Business Suite</title>

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Onusuite — The Unified Business Suite" />
    <meta property="og:description" content="Suite logicielle trilingue (FR/EN/AR) pour PME: comptabilité, commercial, RH/paie, trésorerie, stock et plus." />
    <meta property="og:image" content="/brand/og-background.png" />
    <meta property="og:image:width" content="1216" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Onusuite — The Unified Business Suite" />
    <meta name="twitter:description" content="Suite logicielle trilingue (FR/EN/AR) pour PME: comptabilité, commercial, RH/paie, trésorerie, stock et plus." />
    <meta name="twitter:image" content="/brand/og-background.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
