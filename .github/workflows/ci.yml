      # Lot D — 3 exercices, 100 000 écritures aléatoires (graine fixe) : balance, compte de
      # résultat, bilan, à-nouveaux après deux clôtures, numérotation continue, clôture < 30 s.
      # ≈ 70 s sur PostgreSQL 16 local.
      - name: 'AUD : test de propriété comptable, 100 000 écritures (189)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/189_accounting_property_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'LOT6-05 : Scénarios métier E2E (10 parcours)'
        run: npx vitest run src/__tests__/e2e-business-scenarios.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # ═══════════════════════════════════════════════════════════════════════
      # PLAN EN 6 PARTIES PARALLÈLES — les six zones réservées
      # (doc/audit/PLAN-6-PARTIES-PARALLELES-2026-10-05.md, règle R5)
      #
      # Le 05/10, quatre commits partis de `main` en parallèle ont TOUS touché
      # `ci.yml`, `SUIVI-CHANTIERS.md` et les mêmes `.any-ceiling.json` : le
      # découpage par sujet ne suffisait pas. D'où les six MARQUEURS ci-dessous.
      #
      # ⚠️ LA RÈGLE, EN UNE LIGNE : chaque partie n'ajoute ses suites que SOUS
      # SON PROPRE MARQUEUR. Jamais au-dessus, jamais ailleurs dans le fichier.
      # Un bloc écrit entre deux marqueurs apartient à personne : à la fusion,
      # le conflit est long et personne ne sait qui l'a écrit.
      #
      # ⚠️ CES SIX BLOCS SONT VIDES AU 05/10/2026 — c'est voulu. Ils posent le
      # cadre (étape 0.8) ; les parties remplissent le leur. Ne pas les
      # supprimer en croyant nettoyer un fichier vide : ils sont la frontière.
      # ═══════════════════════════════════════════════════════════════════════

      # --- plan6:a --- chaînes, métriques, robustesse, cohérence ---
      # Territoire : app/sql/*chain*, *metric*, ci/check_chain*, ci/check_effects*
      # Plage : 423→429, 437→449, 457→459, 468→499

      # --- plan6:b --- règles d'état, paie française ---
      # Territoire : règles d'état par module ; app/src/lib/payroll*, écrans de paie
      # Plage : 500→559
