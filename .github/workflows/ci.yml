      # les six raisons en PREUVES mesurées, datées, opposables.
      # Le septième, INV-19, était mesurable : sa raison disait « Devient
      # mesurable dès qu'un registre des types de documents est écrit (c'est la
      # matière de la vue chaîne, lot L6) ». La 431 écrit ce registre
      # (`chain_document_types`) et INV-19 devient mesuré : 13 → 14. L6 n'aura
      # plus à l'inventer.
      # 7 scénarios : le relevé mesure 14, un orphelin RÉEL est compté, ⚠️ le
      # garde anti-faux-vert (un lien de type NON ENREGISTRÉ fait rompre
      # l'invariant et nomme le type — jamais « tenu » sur ce qu'il n'a pas su
      # regarder), la délégation aux treize branches de la 413 est intacte ET la
      # garde « mesurable sans branche LÈVE » survit au wrapper, les six
      # raisons portent leur mesure, la table est RLS forcée en lecture seule
      # (une écriture de client ferait verdir INV-19 à volonté), et le registre
      # est cloisonné par société. Sans ce branchement (G5), la suite passerait
      # et ne protégerait rien — l'angle mort que le commit 5b7d915 reprochait
      # à la 414.
      - name: 'L4 : le dernier invariant mesurable et les six preuves (431)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/431_chain_l4_invariants_mesurables_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L4 — LES TROIS FUITES ENTRE SOCIÉTÉS, ET LEUR NON-RÉGRESSION (437).
      # Le 02/10, en validant la 414, trois défauts d'isolation ont été trouvés et
      # corrigés. Les corrections n'étaient prouvées que par des MESURES
      # MANUELLES — rien ne les rejouait. Cette suite les rend opposables :
      #   T01 `_mk_tenant_contexte` (helper de test, SECURITY DEFINER) n'est plus
      #        exécutable par `authenticated` ni `anon` — sans le REVOKE, un client
      #        choisissait sa société et la RLS s'appliquait dessus ;
      #   T02 `chain_degradation_detectee` refuse la société d'autrui ET répond
      #        pour la sienne (une garde, pas une fonction cassée) ;
      #   T03 `releve_id` est une clé COMPOSITE (tenant_id, releve_id) : une alerte
      #        de SEPT ne peut pas viser le relevé de SIX (porte ISO-02).
      # Les trois exigent un REFUS, pas un compte : un compte de zéro passerait
      # aussi sur une base vide. T01 vérifie en plus que la fonction existe —
      # sans quoi il passerait sur une absence (faux vert mesuré le 02/10).
      # Placée APRÈS la 431, qui crée le helper, et APRÈS la 414, qui crée les
      # tables : jouée seule, T01 dirait honnêtement qu'il ne peut rien prouver.
      - name: 'L4 : les trois fuites entre sociétés restent fermées (437)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/437_chain_l4_fuites_fermees_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

