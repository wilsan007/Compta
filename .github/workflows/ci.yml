      # R-001 (partie B, lot Ventes) — un devis ACCEPTÉ produit sa commande
      # (brouillon), prix gelé, lien `created_from`, événement `quotes.accepted`.
      - name: 'plan6 B — R-001 : devis accepté → commande (500)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/500_regle_ventes_devis_accepte_commande_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-004 (partie B, lot Ventes) — une commande FACTURÉE se rapproche de ses
      # factures (lien `invoiced_by`), reliquat non facturé mesuré.
      - name: 'plan6 B — R-004 : commande facturée → rapprochement (501)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/501_regle_ventes_commande_facturee_tests.sql
        env:
