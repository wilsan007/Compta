name: CI - Tests & Quality

on:
  push:
    branches: [main, master, develop, commercial-hr-paie]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Every night at 2:00 AM UTC (regular regression testing)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2e tests (Playwright)'
        type: boolean
        default: true
      run_full_suite:
        description: 'Run full test suite (unit + e2e + security)'
        type: boolean
        default: true

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint + Type Check (fast, always runs)
  # ─────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint --max-warnings=0

      - name: 'UX-03 : No window.confirm'
        run: |
          if grep -rn "window\.confirm" src/ --include="*.tsx" --include="*.ts" | grep -v "confirm.tsx" | grep -v "useConfirm.tsx"; then
            echo "ERROR: window.confirm is forbidden. Use confirmSync() from '@/lib/confirm' instead."
            exit 1
          fi

      - name: Type check (tsc -b)
        run: npx tsc -b --noEmit --pretty

      - name: 'LOT7-07 : Boutons icône avec libellé accessible'
        run: node scripts/check-a11y-icon-buttons.mjs

      - name: 'LOT7-07 : Contraste des couleurs (WCAG AA)'
        run: node scripts/check-contrast.mjs

      - name: 'LOT6-04 : Dead code ceiling (knip)'
        run: node scripts/check-knip-ceiling.mjs

      - name: 'LOT6-04 : Unused tables ceiling'
        run: node scripts/check-unused-tables.mjs

  # ─────────────────────────────────────────────
  # Job 2: i18n Key Parity Check
  # ─────────────────────────────────────────────
  i18n-check:
    name: i18n (parité fr/en/ar + clés utilisées)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # check-i18n-usage.mjs analyse le code avec le compilateur TypeScript
      - name: Install dependencies
        run: npm ci

      - name: Check i18n key parity
        run: node scripts/check-i18n.mjs

      # AUD lot I : toute clé littérale t('…') doit exister en fr dans l'espace
      # de noms de son useTranslation (la parité seule ne le voit pas)
      - name: 'Lot I : clés i18n utilisées dans le code'
        run: node scripts/check-i18n-usage.mjs

  # ─────────────────────────────────────────────
  # Job 3: Unit Tests + Coverage
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 'LOT5-05 : Garde SSRF webhook (bypass IP encodés)'
        run: npx vitest run src/lib/__tests__/ssrfGuard.test.ts

      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: E2E Tests (Playwright)
  # Runs: nightly, manual, or on PR with label
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          CI: 'true'
          # Sans ces secrets, les tests authentifiés s'abstiennent explicitement
          # (E2E_CREDENTIALS_CONFIGURED dans e2e/helpers.ts) au lieu de passer
          # au vert contre l'écran de connexion. À renseigner dans
          # Settings > Secrets > Actions pour que la suite prouve quelque chose.
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
          # `src/lib/supabase.ts` lève à l'import si ces deux variables
          # manquent : sans elles le serveur de développement sert une
          # application qui ne démarre pas, et même la page de connexion est
          # vide. Trouvé au premier passage réel de la CI.
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (nightly + manual)
  # ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SEC-01: gitleaks needs full history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
        # OPS-01: Retirer continue-on-error — le CI doit échouer sur les vulnérabilités

      - name: Gitleaks — scan for secrets in code and git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # SEC-01: Remplace le grep manuel par gitleaks (détecte plus de patterns)

  # ─────────────────────────────────────────────
  # Job 5: DB Integration Tests (SOC-02)
  # Teste les triggers, fonctions PL/pgSQL et politiques RLS en CI
  # ─────────────────────────────────────────────
  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_compta
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Charger le schéma de base
        run: |
          # Objets Supabase absents d'un PostgreSQL nu (auth, storage, rôles, pg_cron)
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/00_supabase_stubs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/00_schema_dump.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Appliquer les migrations
        run: node run-sql-migrations.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Installer plpgsql_check
        run: |
          # Le conteneur de service GitHub Actions a un nom aléatoire : le retrouver par son image
          PG_CONTAINER=$(docker ps -q --filter "ancestor=postgres:16" | head -1)
          docker exec "$PG_CONTAINER" apt-get update -qq
          docker exec "$PG_CONTAINER" apt-get install -y -qq postgresql-16-plpgsql-check
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS plpgsql_check;"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Valider toutes les fonctions PL/pgSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_plpgsql.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Contrôle de trigger atteignable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_trigger_reachability.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Une fonction SECURITY DEFINER exposée à `authenticated` qui reçoit un uuid
      # du client doit vérifier que l'appelant appartient à la société visée.
      # Ce contrôle a trouvé six fonctions qui ne le faisaient pas (227), dont une
      # qui supprimait des données et une qui insérait des écritures comptables.
      - name: Garde de société sur les fonctions exposées
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_tenant_guard.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # 332 des 389 fonctions étaient exécutables par `anon`, le rôle du visiteur
      # non connecté — dont trois fonctions SECURITY DEFINER qui écrivent,
      # lancées sans jeton pour le prouver (228). Le droit PUBLIC de
      # CREATE FUNCTION revient à chaque fonction créée : ce contrôle est le
      # seul garde-fou permanent. Il passe AVANT les suites, qui créent leur
      # propre outillage dans `public`.
      - name: Droits du visiteur non connecté sur les fonctions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_anon_grants.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Générer les types TypeScript depuis PostgreSQL
        run: node scripts/generate-db-types.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Vérifier que les types sont à jour
        run: |
          if git diff --name-only src/types/database-generated.ts | grep -q .; then
            echo "ERROR: Les types générés diffèrent. Exécutez localement: node scripts/generate-db-types.mjs"
            git diff src/types/database-generated.ts
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: LOT7-04 — Vérifier les colonnes et jointures contre PostgREST
        run: |
          # Les selects Supabase sont des chaînes de caractères : ni tsc ni les tests
          # unitaires (où Supabase est mocké) ne voient une colonne inexistante ou un
          # embed ambigu. Seul un vrai PostgREST les refuse — 19 requêtes cassées ont
          # été trouvées ainsi le 17/09/2026.
          # `--network host` : le service PostgreSQL du job est publié sur localhost.
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:postgres@localhost:5432/test_compta" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=postgres \
            -e PGRST_DB_MAX_ROWS=1000 \
            -e PGRST_SERVER_PORT=3333 \
            postgrest/postgrest:v16.3
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:3333/employees?limit=1" && break
            sleep 2
          done
          curl -sf -o /dev/null "http://localhost:3333/employees?limit=1" || {
            echo "PostgREST n'a pas démarré :"; docker logs pgrst; exit 1; }
          node scripts/check-embeds.mjs
        env:
          PGRST_URL: http://localhost:3333

      - name: Tests de triggers (SOC-01)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/102_trigger_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Tests RLS (SOC-02)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/105_rls_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'Tests de permissions (has_permission)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/166_permission_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Tests de rapprochement des règlements (B3)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/170_payment_reconciliation_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'LOT5-05 : Bypass SSRF sur is_allowed_webhook_url'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/168_ssrf_bypass_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Valorisation du stock bout en bout (B8)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/173_stock_valuation_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Lettrage bout en bout (B10)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/175_lettrage_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Coût de revient et production bout en bout (B9)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/177_manufacturing_cost_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # AUD-A01/A03 — scénarios de l'audit du 21/09 (doc/audit/PLAN-CORRECTIF-AUDIT-2026-09-21.md).
      # Les défauts encore ouverts sont listés dans sql/ci/expected_failures.sql : un échec
      # hors registre casse la CI, et un défaut corrigé encore inscrit la casse aussi.
      - name: 'AUD : noyau de saisie comptable (178)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/178_accounting_kernel_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'AUD : clôture et états financiers (179)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/179_closing_and_statements_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'AUD : ventes vers comptabilité (180)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/180_sales_to_ledger_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'AUD : paie vers comptabilité (181)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/181_payroll_to_ledger_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'AUD : inscription et mise en service (182)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/182_signup_provisioning_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Plan comptable par pays (201) : France = PCG, Djibouti = PCG provisoire puis plan DJ
      # publié (bascule automatique), autres pays refusés. Transaction annulée en fin de fichier.
      - name: 'Plan comptable par pays (202)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/202_chart_by_country_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'AUD : achats et trésorerie vers comptabilité (192)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/192_purchases_treasury_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # TVA autoliquidée (AUTOLIQ, UE) sur des comptes propres, déclaration par le grand livre
      - name: 'AUD : TVA autoliquidée séparée (197)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/197_vat_reverse_charge_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-03 — acomptes : D 411 / C 4191 / C 4457, déduction sur la facture finale, lettrage 4191.
      - name: 'AUD : factures d''acompte et déduction (210)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/210_advance_invoices_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-01 — amortissements, écarts de lettrage, charges/produits constatés d'avance :
      # écriture en brouillard puis validation, comptes du plan, idempotence.
      - name: 'AUD : amortissements, écarts et reports (211)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/211_asset_deferred_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-04 — paiement de la paie : D 421 par salarié (lettré) / C banque,
      # D 431 et D 447 / C banque, acomptes 425, idempotence et statut du lot.
      - name: 'AUD : paiement de la paie (212)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/212_payroll_payment_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-05 — avoirs sans article : contrepassation des comptes de la facture d'origine.
      - name: 'AUD : avoirs sans article (213)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/213_credit_note_accounts_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Le numéro légal porte l'ANNÉE de l'exercice, jamais son libellé libre
      # (trouvé sur copie de prod : FAC-FY2026-000001 au lieu de FAC-2026-000001)
      - name: 'AUD : année du numéro de pièce (216)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/216_document_number_year_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Suite de la 216 — MÊME défaut sur le numéro d'ÉCRITURE (posting_number),
      # qui est exporté au FEC comme numéro de pièce : AN-EX2024-000001,
      # VT-FY2026-000001 au lieu de VT-2026-000001.
      - name: 'AUD : année du numéro d''écriture (217)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/217_posting_number_year_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # D-12 — la numérotation reprend après le plus grand numéro déjà attribué
      # à la société : une société reprise ne réattribue pas un numéro existant.
      - name: 'AUD : reprise de la numérotation (218)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/218_document_number_seed_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-13 — clôture de caisse : TVA ventilée par taux, écart de caisse en
      # 658/758 contre le compte du moyen de paiement espèces.
      - name: 'AUD : clôture de caisse, TVA et écart (219)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/219_pos_vat_cash_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-17 — les RPC de paie gardent le rôle : payroll.post et payroll.pay,
      # socle du comptable, et le corps renommé n'est plus exposé.
      - name: 'AUD : droits des RPC de paie (220)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/220_payroll_permission_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-12 — une facture créée par l'API a des lignes : refus explicite sinon,
      # et totaux recalculés depuis les lignes.
      - name: 'AUD : facture créée par l''API (221)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/221_invoice_api_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-07 — la même opération saisie puis importée n'est comptée qu'une fois :
      # nature « book » / « statement », solde recalculé, suppression rattrapée.
      - name: 'AUD : nature des lignes bancaires et solde (222)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/222_bank_transaction_kind_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-09 — l'état de rapprochement : écarts des deux côtés, solde de clôture
      # comparé, pointage à deux côtés, comptabilisation d'une ligne non pointée.
      - name: 'AUD : état de rapprochement bancaire (223)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/223_bank_reconciliation_state_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Vérification en profondeur de R-01 à R-08 (23/09) — trois défauts mesurés
      # sur base neuve, rouges avant ces migrations.

      # R-04 — le versement de la paie n'accepte qu'un lot de la société active,
      # et solde chaque compte de dette sociale, pas seulement le premier.
      - name: 'AUD : périmètre du versement de la paie (224)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/224_payroll_payment_scope_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-06 — l'ordre des lignes d'une commande est total : deux lignes ne
      # peuvent plus porter le même, sinon une réception compterait deux fois.
      - name: 'AUD : ordre total des lignes de commande (225)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/225_purchase_line_order_unique_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-01 — la VNC de l'historique d'amortissement ne retranche plus deux fois
      # la valeur résiduelle : elle dit le même chiffre que la fiche.
      - name: 'AUD : valeur nette et valeur résiduelle (226)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/226_asset_net_book_value_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Agir au nom d'une autre société : import annulé ou validé, rapprochement
      # à trois voies, écriture récurrente — quatre scénarios vus rouges avant.
      - name: 'AUD : garde de société sur les RPC exposées (227)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/227_tenant_guard_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'H09 : droits des fonctions (228)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/228_function_grants_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # H06 — séparation des tâches : l'auteur d'une écriture saisie ne la valide
      # pas lui-même. created_by n'était jamais renseigné : le contrôle rendait
      # « vrai » sans rien comparer (T01, T02, T03, T05 vus rouges).
      - name: 'H06 : séparation des tâches (232)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/232_segregation_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # H11 — journal fiscal NF-525 : le contrôle d'intégrité déclarait invalide
      # toute chaîne, même intacte (id comparé à lui-même). T01, T02, T03 et T05
      # vus rouges sur la version d'avant.
      - name: 'H11 : intégrité du journal NF-525 (233)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/233_nf525_chain_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # H10 — file de webhooks : rien n'y entrait (event_name NOT NULL jamais
      # écrit), rien n'en sortait (colonne de retard inexistante), et le cron
      # brûlait les tentatives sans envoyer. T01 à T07 vus rouges.
      - name: 'H10 : file de livraison des webhooks (234)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/234_webhook_queue_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # R-06 — allocation d'une réception partielle : ordre de saisie (line_order),
      # plus jamais l'ordre des uuid.
      - name: 'AUD : ordre des lignes de commande à la réception (214)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/214_purchase_receipt_order_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Lot D — 3 exercices, 100 000 écritures aléatoires (graine fixe) : balance, compte de
      # résultat, bilan, à-nouveaux après deux clôtures, numérotation continue, clôture < 30 s.
      # ≈ 70 s sur PostgreSQL 16 local.
      - name: 'AUD : test de propriété comptable, 100 000 écritures (189)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/189_accounting_property_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'LOT6-05 : Scénarios métier E2E (10 parcours)'
        run: npx vitest run src/__tests__/e2e-business-scenarios.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

  # ─────────────────────────────────────────────
  # Job 6: Build verification
  # ─────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, i18n-check, unit-tests]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: app/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Summary job for branch protection
  # ─────────────────────────────────────────────
  ci-success:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-typecheck, i18n-check, unit-tests, db-integration, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "lint-typecheck: ${{ needs.lint-typecheck.result }}"
          echo "i18n-check: ${{ needs.i18n-check.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "db-integration: ${{ needs.db-integration.result }}"
          echo "build: ${{ needs.build.result }}"
          if [[ "${{ needs.lint-typecheck.result }}" != "success" || "${{ needs.i18n-check.result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" || "${{ needs.db-integration.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "CI FAILED — one or more required jobs did not pass"
            exit 1
          fi
          echo "CI PASSED — all required jobs succeeded"
