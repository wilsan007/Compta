name: CI - Tests & Quality

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Every night at 2:00 AM UTC (regular regression testing)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2e tests (Playwright)'
        type: boolean
        default: true
      run_full_suite:
        description: 'Run full test suite (unit + e2e + security)'
        type: boolean
        default: true

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint + Type Check (fast, always runs)
  # ─────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint --max-warnings=0

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit --pretty

  # ─────────────────────────────────────────────
  # Job 2: i18n Key Parity Check
  # ─────────────────────────────────────────────
  i18n-check:
    name: i18n Key Parity (fr/en/ar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check i18n key parity
        run: node scripts/check-i18n.mjs

  # ─────────────────────────────────────────────
  # Job 3: Unit Tests + Coverage
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 3: E2E Tests (Playwright)
  # Runs: nightly, manual, or on PR with label
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (nightly + manual)
  # ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for potential secrets in source files..."
          ! grep -rnE "(api[_-]?key|secret[_-]?key|password)\s*[:=]\s*['\"][^'\"]{16,}" src/ \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=__tests__ \
            || (echo "WARNING: Potential hardcoded secrets found" && exit 1)
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 5: Build verification
  # ─────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, i18n-check, unit-tests]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: app/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Summary job for branch protection
  # ─────────────────────────────────────────────
  ci-success:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-typecheck, i18n-check, unit-tests, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "lint-typecheck: ${{ needs.lint-typecheck.result }}"
          echo "i18n-check: ${{ needs.i18n-check.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "build: ${{ needs.build.result }}"
          if [[ "${{ needs.lint-typecheck.result }}" != "success" || "${{ needs.i18n-check.result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "CI FAILED — one or more required jobs did not pass"
            exit 1
          fi
          echo "CI PASSED — all required jobs succeeded"
