      #     CORRECTEMENT refusé ;
      #   • D1 comptait les traces `ignore` comme des duplications : les deux
      #     maillons de paie sortaient `rompu` alors que leur rejeu est tenu
      #     (0 lien, 0 ligne, et une trace qui le dit) ;
      #   • D1 n'a pas d'objet sur un maillon de CRÉATION : rejouer
