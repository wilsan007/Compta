      # L1, tranche 5 — LES CINQ CANDIDATS DIRECTS de l'inventaire §2, ceux qui
      # remplissent les deux conditions de la doctrine compagnon. La 316 les couvre
      # par déclencheur compagnon : écart de change au règlement, facturation des
      # temps, rappels de paie, acomptes de paie, appariement d'une ligne de relevé.
      # Deux points de méthode, mesurés par la suite au premier passage :
      #   • le compagnon RELIT le marqueur dans la table, jamais dans `NEW` — le
      #     maillon métier le pose par un `UPDATE` à l'intérieur de SON déclencheur
      #     `AFTER`, et la copie `NEW` ne le porte pas (l'écart de change et
      #     l'appariement bancaire échouaient ainsi) ;
      #   • `min(uuid)` n'existe pas en PostgreSQL, et l'aval de référence des
      #     rappels/acomptes est obtenu par tri explicite.
      # La valeur `sans_effet` ajoutée au vocabulaire par la 315 sert ici au cas
      # pour lequel elle a été conçue : un effet ATTENDU qui n'existe pas (écart de
      # change marqué sans écriture, rappel marqué traité sans élément de paie).
      # 12 scénarios.
      - name: 'L1 : les cinq candidats directs sont tracés (316)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/406_chain_l1_candidats_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # D-4 (option A) — le bucket d'ARCHIVE des PDF produits par le serveur. Le
      # défaut fermé : `generate-pdf` rangeait dans `storage.from("documents")`,
      # un bucket qui n'existe nulle part ; l'upload échouait, l'erreur n'était
      # pas lue, et la fonction rendait `success: true` avec `url: null`. La 317
      # pose le bucket `generated-pdfs` (privé, PDF seulement) et UNE politique :
      # la LECTURE, bornée à la société ET au module porté par le chemin
      # `{société}/{module}/{type}/{fichier}.pdf`. L'absence des trois autres
      # commandes est une DÉCISION (seule la clé de service écrit, ne réécrit pas,
      # et purge), et c'est ce que la suite mesure — y compris que l'absence est
      # bien une absence, et que ce qui n'est pas nommé n'est pas permis. 9
      # scénarios.
      - name: 'D-4 : le bucket d''archive des PDF serveur (317)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/407_pdf_archive_bucket_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # D-5 (migration 318) — le consentement à l'envoi de documents à un tiers.
      # Le défaut (AUD-H04) : l'image d'une facture fournisseur partait chez un
      # prestataire d'OCR sans consentement — et il n'y avait nulle part où le
      # donner. La 318 pose la trace (date + auteur), écrite par un DÉCLENCHEUR :
      # un booléen qu'un client écrit ne prouve rien. La suite mesure les cinq
      # propriétés qui font qu'elle vaut comme preuve : rien par défaut, la date
      # et l'auteur imposés par la base (les valeurs du client sont ignorées),
      # le retrait effectif, la preuve non réécrite par un simple « Enregistrer »
      # des paramètres, et le cloisonnement par société. 5 scénarios.
      #
      # ⚠️ CETTE ÉTAPE DOIT RESTER ICI, APRÈS « types à jour » : une suite crée
      # `_audit_results` (via `ci/audit_helpers.sql`), et câblée plus haut elle
      # ferait entrer ces tables d'outillage dans les types générés. Mesuré le
      # 30/09 — la CI l'a refusé.
      - name: 'D-5 : le consentement OCR est daté et signé (318)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/408_ocr_consent_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L3 (migration 319) — LA RÉCEPTION DE MARCHANDISE, tracée PAR LIGNE. C'est
      # le seul maillon de la liste que l'inventaire de L1 rangeait « réécriture du
      # corps » : N mouvements à partir de N lignes, et la correspondance ligne →
      # ligne ne se devine pas de l'extérieur (les N mouvements portent le même
      # `reference_id`, et l'ordre d'insertion n'est pas une garantie) — c'est la
      # seule justification admise par la doctrine 311.
      # La suite mesure les sept propriétés qui font que le maillon est PILOTÉ et
      # pas seulement exécuté : deux liens pour deux lignes, chacun sur SA ligne,
      # la bonne quantité, la trace `applique` et l'événement, la ligne à zéro qui
      # n'existe pas, le rejeu qui ne double rien, le contrat déclaré, et le
      # cloisonnement. La non-régression est mesurée sur la suite 241 (7/7 avant et
      # après : le corps réécrit garde exactement le comportement de la 241).
      # 7 scénarios.
      - name: 'L3 : la réception de marchandise est tracée par ligne (319)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/409_chain_reception_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L3 (migration 320) — LES CHEMINS D'ANNULATION FERMENT LEURS LIENS, et le
      # maillon des réservations REGAGNE son entrée. C'est le reste que la 319
      # avait nommé en toutes lettres (« il n'appelle pas le cycle du lien
      # (`chain_lien_fermer`) sur le chemin d'annulation : c'est le reste de L3 »),
      # et le §8 de la 312 (« le geste que les maillons ajouteront »). L'état
      # d'entrée, MESURÉ sur la base compilée : deux fonctions seulement
      # mentionnaient `chain_lien_fermer` — les deux portes de la 312 elle-même.
      # Aucun maillon métier ne fermait, donc, et le mensonge était nommé : une
      # commande annulée gardait ses liens `actif` alors que ses réservations sont
      # libérées, une livraison gardait le sien alors que sa sortie est
      # contrepassee (253), une réception aussi (251).
      # La 320 pose TROIS déclencheurs compagnons `zz_l3_` (un par chemin
      # d'annulation qui CONTRÉPASSE un effet tracé) — un compagnon suffit ici
      # parce que la fermeture CONSTATE un effet, elle ne décide de rien — et
      # RÉÉCRIT le seul corps qui devait l'être : `reserve_stock_on_sales_order_
      # confirm`, dont l'entrée `chain_avant` avait été retirée par la 311 (le rouge
      # de la suite 230 T04 : la clé du socle n'avait pas de notion de tour). La
      # 312 a levé cela ; la 320 tient la promesse.
      # La suite mesure les huit propriétés qui font que la fermeture est un ACTE
      # et pas un effet de bord : les liens rompus, datés, motivés, signés et
      # journalisés (M-03 : ils ne sont plus « intacts ») ; l'aval qui reste celui
      # de l'origine (la contrepassation est un fait neuf) ; la réception PAR LIGNE
      # de la 319 rompue ligne par ligne ; le rejeu qui ne double rien ; l'entrée
      # retrouvée (confirmer deux fois ne réserve qu'une fois, traces `ignore`) ;
      # aucun lien à fermer comme cas ORDINAIRE (la fermeture globale rapporte 0) ;
      # le cloisonnement ; et la structure (trois compagnons APRÈS leur maillon,
      # jamais exposés). 8 scénarios.
      - name: 'L3 : les chemins d''annulation ferment leurs liens (320)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/410_chain_lien_fermetures_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L1, tranche 6 — LA CONTRAPASSATION DE PAIE, le SIXIÈME candidat direct.
      # L'inventaire de la tranche 4 (doc/audit/INVENTAIRE-CHAINAGES-L1-TRANCHE4-
      # 2026-09-30.md §2) marque SIX lignes « candidat direct » ; la tranche 5
      # (316) en a tracé CINQ, et son compte (§2, §5) répète ce chiffre. La ligne
      # 22 — `payroll_reverse_posted_run` (248) — portait pourtant le verdict
      # « candidat direct » sans trace ni contrat : c'est l'écart que la 321 ferme.
      # Le maillon est un déclencheur APRÈS dont l'aval est identifiable par la clé
      # qu'il écrit lui-même (`journal_entries.reference = 'PAYROLL-REV-' || <n° du
      # lot>`). Le compagnon (`zz_l1_payroll_run_reversal`, trié après lui) lie le
      # lot à sa contrepassation. Doctrine de la 316, appliquée : le cas ORDINAIRE
      # (lot jamais comptabilisé) ne se trace pas ; l'ANOMALIE (écriture de paie
      # « posted » sans contrepassation) trace `sans_effet` (valeur de la 315).
      # 6 scénarios (T01 le lien, T02 le cas ordinaire, T03 l'anomalie, T04 le
      # rejeu, T05 la structure, T06 l'isolation).
      - name: 'L1 : la contrepassation de paie est tracée (321)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/411_chain_l1_paie_contrepassation_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L3 tranche 2 — LA CAISSE TRACÉE PAR SON CHEMIN D'APPEL (412). Les tranches
      # précédentes n'ont tracé que des maillons que DEUX VOISINS peuvent voir. La
      # caisse n'a pas de voisin : `create_pos_ticket`, `pos_refund_ticket` et
      # `void_pos_ticket` sont appelées par des écrans, et rien d'observable ne
      # subsiste entre l'appel et les tables — un compagnon ne peut pas s'y
      # accrocher. Les trois corps sont donc RENOMMÉS en `_inner` et trois
      # wrappers SECURITY DEFINER portent les noms d'écran : le wrapper est le
      # seul chemin, et c'est lui qui tisse la chaîne.
      # 8 scénarios : T01 deux liens et deux traces `applique` (le maillon est
      # PILOTÉ, pas seulement exécuté) ; T02 les avals sont exacts et le payload
      # porte les identifiants (agrégation par produit dite, pas cachée) ; T03 le
      # cas ORDINAIRE ne se trace pas (un ticket de services ne sort rien) ; T04
      # l'avoir lie le ticket (`adjusted_by`) et ses rentrées, et ROMPT le lien de
      # sa sortie d'origine tout en laissant le PAIEMENT actif (limite de la 255) ;
      # T05 l'annulation rend le stock et la fermeture n'écrit AUCUNE trace
      # (doctrine 312) ; T06 le mode `refuse` ne laisse RIEN persister ; T07
      # STRUCTURE — les corps ne sont exécutables par PERSONNE (leçon R-17) ;
      # T08 CLOISONNEMENT, avec contrôle POSITIF.
      - name: 'L3 : la caisse est tracée par son chemin d''appel (412)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/412_chain_l1_caisse_rpc_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L4 — LES 20 INVARIANTS TRANSVERSAUX, ET L'INDICE DE COHÉRENCE (413).
      # Le référentiel (§E.3) nomme 20 invariants — une égalité entre deux
      # modules qui doit être vraie en permanence — et disait « de l'ordre de 4
      # à 6 sur 20 ». Ce chiffre n'était MESURÉ NULLE PART.
      # Doctrine : un invariant NON MESURABLE ne compte ni au numérateur ni au
      # dénominateur. Afficher « 13/20 » quand sept ne le sont pas serait un
      # mensonge ; l'indice dit « tant tenus sur 13 mesurés, 7 non mesurables
      # sur 20 inscrits ». Un invariant absent du registre serait un invariant
      # oublié ; un invariant inscrit non mesurable est un invariant NOMMÉ.
      # 8 scénarios : le registre et son héritage (standard / société), le
      # dénominateur honnête, le refus d'un relevé vide, l'isolation
      # multi-société, la date et le TenantIndex que la porte G1 exige.
      - name: 'L4 : les 20 invariants transversaux et l''indice (413)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/413_chain_l4_invariants_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L4, tranche 2 — L'ALERTE EN CAS DE DÉGRADATION (414). La 413 produit un
      # historique que personne ne regarde : l'indice peut tomber en silence et
      # l'éditeur découvre le lendemain qu'un maillon s'est cassé. La 414 compare
      # le relevé du jour au relevé PRÉCÉDENT et alerte sur une perte, un
      # agravement, ou un invariant redevenu mesurable et rompu. Elle n'alerte
      # PAS sur une amélioration (alerter sur une bonne nouvelle est un défaut de
      # conception), ni sur un écart déjà rompu et stationnaire.
      # 7 scénarios : le premier passage n'alerte pas, la perte est détectée,
      # écrite et notifiée, le rejeu est sans effet (unicité posée en BASE),
      # l'aggravation d'un écart déjà signalé est notifiée, les fonctions et
      # les index sont en place, et le job nocturne est inscrit quand pg_cron
      # existe. Sans ce branchement (G5), la suite passerait et ne protégerait
      # rien.
      - name: 'L4 : l''alerte en cas de dégradation (414)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/414_chain_l4_alerte_degradation_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # W9 — le chaînage de l'absence, quatre étages. La 263 pose le registre
      # (`employee_absence_days`) où convergent les QUATRE sources (congé approuvé,
      # arrêt de maladie, arrêt de travail, pointage d'absence — la colonne
      # `timesheets.absence_type` que personne n'écrivait) ; la 264 rend ce registre
      # OPPOSABLE (pointage, heures supplémentaires, temps projet, frais, tâches) et
      # pose le contrôle quotidien ; la 265 ramène la paie à UN seul chemin de
      # retenue (deux déclencheurs écrivaient pour la même journée, et le second
      # écrivait un type qu'aucun moteur de bulletin ne lit) ; la 266 vérifie la
      # chaîne de bout en bout — une absence d'un jour apparaît UNE fois dans la
      # paie, la DSN, le coût projet et le plafond, et une absence annulée n'y est
      # plus appliquée. 13 + 11 + 10 + 34 scénarios.
      - name: 'W9 : le registre d''absence (263)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/263_absence_registry_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'W9 : les gardes en aval et le contrôle quotidien (264)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/264_absence_guards_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'W9 : une seule retenue de paie par jour d''absence (265)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/265_absence_payroll_single_path_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'W9 : la chaîne de l''absence, 34 assertions transverses (266)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/266_absence_transverse_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # W10 — le contrat d'appel front ↔ base, et la clôture NF-525. Le contrôle
      # `check-rpc-contract.mjs` trouvait 14 appels que la base ne pouvait pas
      # servir (4 fonctions de DÉCLENCHEUR appelées depuis des écrans, un stock
      # compté deux fois, la période NF-525 envoyée comme une date, une paie IJSS
      # calculée sur un couple (salarié, jours)) ; la 267 rend la CLÔTURE possible :
      # elle n'écrit plus dans le journal inaltérable (`UPDATE … SET closed`, qui
      # levait toujours « NF525: Le journal d'événements est inaltérable ») mais
      # AJOUTE l'événement de clôture et inscrit la clôture dans
      # `nf525_period_closures` — la table que lit l'attestation, et que rien ne
      # remplissait : l'attestation levait « Période non clôturée ». 6 scénarios,
      # dont T04 et T05 ROUGES avant la 267.
      - name: 'W10 : le contrat d''appel et la clôture NF-525 (267)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/267_nf525_closure_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # W6 — les fonctions Edge et les écrans placebos. Le scanner W0.2 (colonnes
      # écrites) trouvait 20 écritures impossibles, toutes dans les fonctions Edge
      # sauf deux dans le front : les écrans écrivaient des colonnes qui n'existent
      # pas, `cron-payment-reminders` échouait dès la première facture puis
      # relançait le client **tous les jours**, le bouton « Synchroniser » ne
      # synchronisait rien, la facture électronique n'était jamais enregistrée
      # (double envoi) et l'EDI-TVA n'envoyait rien. La 257 pose les colonnes
      # réelles avec leurs garanties, la 258 rend la relance idempotente, la 259
      # interdit à un client de tamponner une transmission. Les deux baselines
      # gelées par W0 sont à **zéro** dans ce commit.
      - name: 'W6 : les colonnes réelles des fonctions Edge (257)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/257_edge_columns_and_errors_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'W6 : une relance de paiement part une seule fois (258)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/258_payment_reminders_idempotent_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'W6 : un écran ne tamponne plus un succès (259)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/259_placebos_removed_or_wired_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # W5 — un seul moteur par grandeur (IMMO-01 → IMMO-05, RH-04). Mesuré
      # avant : TROIS moteurs d'amortissement se contredisaient (le moteur SQL
      # qui comptabilise, la RPC `calculate_depreciation`, le calcul du front en
      # `floor(jours / 365,25)`), les trois méthodes offertes à l'écran n'avaient
      # aucun effet, un recalcul partait de `Date.now()` (il écrasait la valeur
      # d'un exercice clos) et le lot du front avalait les dotations en échec
      # (`console.error`) ; les heures supplémentaires avaient trois moteurs,
      # deux seuils (7 h et 8 h) et un montant NUL. La 260 n'en garde qu'un de
      # chaque : la méthode est LUE (linéaire, dégressif paramétré, et
      # `units_of_production` RETIRÉE faute de compteur d'unités), l'exercice est
      # borné, le lot rend un verdict PAR immobilisation (`echecs` nommés), et le
      # pointage écrit ses heures sup avec un MONTANT (taux horaire de la société
      # × majoration paramétrée). 10 scénarios, 9 rouges avant.
      # Le miroir côté front (aucun écran ne réintroduit un moteur) est mesuré par
      # `src/lib/__tests__/single-engine.test.ts` (Vitest).
      - name: 'W5 : un seul moteur par grandeur — amortissement et heures sup (260)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/260_single_depreciation_engine_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta


      # ISO-01 — les déclencheurs SECURITY DEFINER écrivaient dans la société de la
      # ligne VISÉE, jamais dans celle du mouvement : la société A fermait une tâche
      # de la société B, dont elle ne voyait même pas la ligne (SECURITY DEFINER
      # contourne la RLS). La 236 filtre les dix-huit fonctions d'écriture relevées
      # (sept scénarios vus rouges avant) ; ce fichier prouve l'effet dans les deux
      # sens — la donnée de B intacte, l'action légitime de A toujours faite — et
      # porte le T02 resté rouge au registre : l'insertion inter-sociétés attend les
      # clés étrangères composites (ISO-02, vague 237).
      - name: 'ISO-01 : écritures des déclencheurs SECURITY DEFINER (236)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/236_security_definer_tenant_writes_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # ISO-02 — une clé étrangère mono-colonne ne regarde pas la société : la
      # facture de A pouvait désigner le client de B, que A ne voyait même pas en
      # lecture. La 237 a converti les 408 clés relevées en clés composites
      # `(tenant_id, colonne)` — dont 200 en `ON DELETE SET NULL (colonne)`, sans
      # quoi la clé annulerait aussi `tenant_id`, NOT NULL, et la suppression
      # légitime échouerait. La 249 reprend les 2 clés nées APRÈS la 237 (241 en
      # ajoute une avec sa colonne, 244 recrée la seconde mono-colonne), que seul
      # le contrôle permanent, qui mesure l'état final, pouvait trouver. Le T02 de
      # la 236 (l'insertion inter-sociétés encore acceptée) est passé au vert et sa
      # ligne a quitté le registre des échecs attendus dans le même commit.
      - name: 'ISO-02 : clés étrangères composites (237)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/237_composite_foreign_keys_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # ISO-03 / ISO-04 — 495 couples (table, commande) portaient deux politiques
      # permissives : la plus large gagnait, et les 57 gardes `can_perform` des
      # politiques par table n'étaient jamais atteintes. La 238 a retiré les 506
      # politiques en trop et 12 index en double. Le scénario décisif est T03 :
      # un `viewer` ne peut plus insérer par appel direct, et un administrateur
      # le peut toujours.
      - name: 'ISO-03/ISO-04 : dédoublonnage des politiques et des index (238)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/238_policy_dedup_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # PERM-01 — un `viewer` créait une facture et supprimait un client par appel
      # direct : la matrice des rôles n'était opposable nulle part. La 239 a posé
      # `can_perform` sur les 41 tables où l'argent, les personnes et la
      # comptabilité circulent (décision D-6, tranche assumée et chiffrée). Le
      # fichier rejoue le constat `M18_role_non_opposable.sql` et mesure, dans le
      # même geste, que chaque rôle garde ce qu'il doit pouvoir faire.
      - name: 'PERM-01 : rôles opposables (239)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/239_roles_opposables_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Lot D — 3 exercices, 100 000 écritures aléatoires (graine fixe) : balance, compte de
      # résultat, bilan, à-nouveaux après deux clôtures, numérotation continue, clôture < 30 s.
      # ≈ 70 s sur PostgreSQL 16 local.
      - name: 'AUD : test de propriété comptable, 100 000 écritures (189)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/189_accounting_property_tests.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: 'LOT6-05 : Scénarios métier E2E (10 parcours)'
        run: npx vitest run src/__tests__/e2e-business-scenarios.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

  # ─────────────────────────────────────────────
  # Job 6: Build verification
  # ─────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, i18n-check, unit-tests]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: app/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # X0 — le chemin de l'écran (audit fonctionnel exécuté du 28/09/2026)
  # Tout était vert, et 14 défauts critiques existaient : les tests unitaires
  # simulent Supabase, les suites SQL insèrent en base sans passer par l'écran.
  # Ce job fait tourner les VRAIES fonctions de requête des écrans, avec leur
  # charge utile, à travers PostgREST réel et des JWT réels (4 comptes créés par
  # l'inscription réelle). Les défauts encore ouverts sont inscrits au registre
  # src/__screen__/expected_failures.json : un rouge hors registre casse la CI,
  # un vert encore inscrit aussi.
  # ─────────────────────────────────────────────
  screen-path:
    name: Chemin de l'écran (PostgREST réel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_compta
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Schéma et migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/00_supabase_stubs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/00_schema_dump.sql
          node run-sql-migrations.mjs

      - name: 'X0 : colonnes écrites par les écrans à travers les fonctions (baseline gelée)'
        run: node scripts/check-screen-writes.mjs

      - name: Comptes du banc (inscription réelle) et secrets éphémères
        run: node scripts/screen-rig/setup.mjs

      - name: PostgREST réel et passerelle JWT
        run: |
          SECRET=$(node -e "console.log(require('./.screen-rig/rig.json').jwtSecret)")
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://authenticator:screen-rig@localhost:5432/test_compta" \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$SECRET" -e PGRST_DB_MAX_ROWS=1000 -e PGRST_SERVER_PORT=3399 \
            postgrest/postgrest:v16.3
          for i in $(seq 1 30); do curl -sf http://localhost:3399/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3399/ >/dev/null || { docker logs pgrst; exit 1; }
          nohup node scripts/screen-rig/gateway.mjs > .screen-rig/gateway.out 2>&1 &
          for i in $(seq 1 15); do curl -s http://localhost:54399/auth/v1/health >/dev/null && break; sleep 1; done

      - name: 'X0 : scénarios s1–s15 par les fonctions des écrans'
        run: npx vitest run -c vitest.screen.config.ts

      - name: Journal de la passerelle et verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-path
          path: |
            app/.screen-rig/out/
            app/.screen-rig/gateway.log
          retention-days: 7

  # ─────────────────────────────────────────────
  # Summary job for branch protection
  # ─────────────────────────────────────────────
  ci-success:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-typecheck, i18n-check, unit-tests, db-integration, screen-path, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "lint-typecheck: ${{ needs.lint-typecheck.result }}"
          echo "i18n-check: ${{ needs.i18n-check.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "db-integration: ${{ needs.db-integration.result }}"
          echo "screen-path: ${{ needs.screen-path.result }}"
          echo "build: ${{ needs.build.result }}"
          if [[ "${{ needs.lint-typecheck.result }}" != "success" || "${{ needs.i18n-check.result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" || "${{ needs.db-integration.result }}" != "success" || "${{ needs.screen-path.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "CI FAILED — one or more required jobs did not pass"
            exit 1
          fi
          echo "CI PASSED — all required jobs succeeded"
