name: CI - Tests & Quality

on:
  push:
    branches: [main, master, develop, commercial-hr-paie]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Every night at 2:00 AM UTC (regular regression testing)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2e tests (Playwright)'
        type: boolean
        default: true
      run_full_suite:
        description: 'Run full test suite (unit + e2e + security)'
        type: boolean
        default: true

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint + Type Check (fast, always runs)
  # ─────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint --max-warnings=0

      - name: 'UX-03 : No window.confirm'
        run: |
          if grep -rn "window\.confirm" src/ --include="*.tsx" --include="*.ts" | grep -v "confirm.tsx" | grep -v "useConfirm.tsx"; then
            echo "ERROR: window.confirm is forbidden. Use confirmSync() from '@/lib/confirm' instead."
            exit 1
          fi
          # X7 (audit du 28/09/2026) : un `confirm(` nu échappait au motif ci-dessus
          # (19 appels dans 13 écrans). Les tests et le module de confirmation sont exclus.
          if grep -rnE "(^|[^a-zA-Z_.])confirm\(" src/ --include="*.tsx" --include="*.ts" | grep -v "__tests__" | grep -v "src/lib/confirm"; then
            echo "ERROR: bare confirm() is forbidden. Use confirmSync() from '@/lib/confirm' instead."
            exit 1
          fi

      - name: Type check (tsc -b)
        run: npx tsc -b --noEmit --pretty

      - name: 'LOT7-07 : Boutons icône avec libellé accessible'
        run: node scripts/check-a11y-icon-buttons.mjs

      - name: 'LOT7-07 : Contraste des couleurs (WCAG AA)'
        run: node scripts/check-contrast.mjs

      - name: 'LOT6-04 : Dead code ceiling (knip)'
        run: node scripts/check-knip-ceiling.mjs

      - name: 'LOT6-04 : Unused tables ceiling'
        run: node scripts/check-unused-tables.mjs

      # Dette de types et d'erreurs avalées — gelée le 2026-10-01, mesurée :
      # 1811 `any` en production (+ 796 dans les tests) et 486 `console.error` en
      # production. Les cibles de remplacement existent déjà (`Row<'table'>` de
      # @/types/dbRow, et `toast()` / `reportSilentFailure()`). Comme pour knip,
      # une hausse casse la CI et une baisse abaisse le plafond automatiquement :
      # le compteur ne peut que descendre.
      - name: 'Dette : plafond des `any` explicites'
        run: node scripts/check-any-ceiling.mjs

      - name: 'Dette : plafond des `console.error`'
        run: node scripts/check-console-error-ceiling.mjs

      # L2 / G5 — le câblage des suites. Deux moitiés de la règle du dépôt (« un
      # défaut = un test rouge avant, le câblage CI dans le même commit ») étaient
      # gardées — le registre des échecs attendus (AUD-X01) et le refus d'un
      # fichier sans verdict (_audit_assert) — la troisième ne l'était pas : une
      # suite peut exister, passer et n'être jouée par PERSONNE. Mesuré le
      # 30/09/2026 : 89 suites, 89 branchées. Ce contrôle tient l'égalité, et il a
      # immédiatement trouvé la suite 312 du cycle de vie du lien, pas encore
      # branchée au moment où il a été écrit.
      - name: 'L2 : toutes les suites du dépôt sont branchées (G5)'
        run: node scripts/check-test-suites.mjs

  # ─────────────────────────────────────────────
  # Job 2: i18n Key Parity Check
  # ─────────────────────────────────────────────
  i18n-check:
    name: i18n (parité fr/en/ar + clés utilisées)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # check-i18n-usage.mjs analyse le code avec le compilateur TypeScript
      - name: Install dependencies
        run: npm ci

      - name: Check i18n key parity
        run: node scripts/check-i18n.mjs

      # AUD lot I : toute clé littérale t('…') doit exister en fr dans l'espace
      # de noms de son useTranslation (la parité seule ne le voit pas)
      - name: 'Lot I : clés i18n utilisées dans le code'
        run: node scripts/check-i18n-usage.mjs

  # ─────────────────────────────────────────────
  # Job 3: Unit Tests + Coverage
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 'LOT5-05 : Garde SSRF webhook (bypass IP encodés)'
        run: npx vitest run src/lib/__tests__/ssrfGuard.test.ts

      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 2 bis: Edge Functions (contrat d'entrée)
  #
  # W6 — « un jeton, une réponse » : les 20 fonctions sont importées et leur
  # gestionnaire est appelé SANS identité ; chacune doit refuser par un code
  # explicite (401/400/405), jamais en rendant `null`. Les vérifications qui
  # trouvent leur verdict dans le code (clé de Luhn d'un SIRET, clé ISO 13616
  # d'un IBAN, format TVA) sont couvertes dans le même mouvement, ainsi que le
  # refus du HTML fourni par le client dans `generate-pdf` (SSRF, AUD-H03).
  #
  # Deno est le runtime des fonctions : le harnais remplace `serve` et le client
  # Supabase par des `stubs/`, il n'y a donc ni base ni réseau dans ces tests.
  # ─────────────────────────────────────────────
  edge-functions:
    name: Edge Functions (contrat d'entrée)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 'W6 : un jeton, une réponse (20 fonctions)'
        run: |
          deno test --allow-env --allow-read \
            --import-map=supabase/functions/__tests__/import_map.json \
            supabase/functions/__tests__/

  # ─────────────────────────────────────────────
  # Job 3: E2E Tests (Playwright)
  # Runs: nightly, manual, or on PR with label
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          CI: 'true'
          # Sans ces secrets, les tests authentifiés s'abstiennent explicitement
          # (E2E_CREDENTIALS_CONFIGURED dans e2e/helpers.ts) au lieu de passer
          # au vert contre l'écran de connexion. À renseigner dans
          # Settings > Secrets > Actions pour que la suite prouve quelque chose.
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
          # `src/lib/supabase.ts` lève à l'import si ces deux variables
          # manquent : sans elles le serveur de développement sert une
          # application qui ne démarre pas, et même la page de connexion est
          # vide. Trouvé au premier passage réel de la CI.
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Security Audit (nightly + manual)
  # ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SEC-01: gitleaks needs full history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
        # OPS-01: Retirer continue-on-error — le CI doit échouer sur les vulnérabilités

      - name: Gitleaks — scan for secrets in code and git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # SEC-01: Remplace le grep manuel par gitleaks (détecte plus de patterns)

  # ─────────────────────────────────────────────
  # Job 5: DB Integration Tests (SOC-02)
  # Teste les triggers, fonctions PL/pgSQL et politiques RLS en CI
  # ─────────────────────────────────────────────
  db-integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_compta
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Charger le schéma de base
        run: |
          # Objets Supabase absents d'un PostgreSQL nu (auth, storage, rôles, pg_cron)
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/00_supabase_stubs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/00_schema_dump.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Appliquer les migrations
        run: node run-sql-migrations.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Installer plpgsql_check
        run: |
          # Le conteneur de service GitHub Actions a un nom aléatoire : le retrouver par son image
          PG_CONTAINER=$(docker ps -q --filter "ancestor=postgres:16" | head -1)
          docker exec "$PG_CONTAINER" apt-get update -qq
          docker exec "$PG_CONTAINER" apt-get install -y -qq postgresql-16-plpgsql-check
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS plpgsql_check;"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Valider toutes les fonctions PL/pgSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_plpgsql.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Contrôle de trigger atteignable
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_trigger_reachability.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Une fonction SECURITY DEFINER exposée à `authenticated` qui reçoit un uuid
      # du client doit vérifier que l'appelant appartient à la société visée.
      # Ce contrôle a trouvé six fonctions qui ne le faisaient pas (227), dont une
      # qui supprimait des données et une qui insérait des écritures comptables.
      - name: Garde de société sur les fonctions exposées
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_tenant_guard.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # 332 des 389 fonctions étaient exécutables par `anon`, le rôle du visiteur
      # non connecté — dont trois fonctions SECURITY DEFINER qui écrivent,
      # lancées sans jeton pour le prouver (228). Le droit PUBLIC de
      # CREATE FUNCTION revient à chaque fonction créée : ce contrôle est le
      # seul garde-fou permanent. Il passe AVANT les suites, qui créent leur
      # propre outillage dans `public`.
      - name: Droits du visiteur non connecté sur les fonctions et les tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_anon_grants.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # X1-urgent (audit fonctionnel exécuté du 28/09/2026, C1/C2) : trois
      # politiques d'écriture ne vérifiaient rien (USING true, tenant_id IS NULL,
      # rôle sans société) — un visiteur non connecté mettait le SMIC global à
      # 1 €. Toute politique d'écriture passe par current_tenant_id() ou
      # auth.uid(), et toute lecture d'une table de société aussi (M12).
      - name: 'X1 : aucune politique n''atteint une ligne globale ou une autre société'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_global_rows_writable.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # Une valeur littérale écrite dans une colonne que la contrainte CHECK
      # n'admet pas fait échouer la transaction sur toutes les données. Ce
      # contrôle a été écrit après la 230 : release_stock_on_delivery écrivait
      # 'fulfilled' dans stock_reservations.status, et aucune commande confirmée
      # ne pouvait passer à « livrée ». check_trigger_reachability ne le voyait
      # pas : il décide des comparaisons, pas des affectations.
      - name: Écritures de statut impossibles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_status_writes.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # ISO-03 / ISO-04 : 495 couples (table, commande) portent DEUX politiques
      # permissives — une générique `tenant_select` et une par table qui porte la
      # garde `can_perform`. Deux politiques permissives sont OU-ées : la plus
      # large gagne, et les 57 gardes de droits deviennent inopérantes, y compris
      # par appel direct à PostgREST. La 238 a retiré les 506 politiques en trop
      # (495 couples, dont 11 en portaient trois) et vidé le registre gelé : le
      # contrôle ne garde plus que la règle et son auto-test.
      - name: Politiques RLS permissives jumelles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_policy_duplicates.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # ISO-02 : une clé étrangère mono-colonne relie encore deux tables
      # cloisonnées — la société A peut désigner une ligne de la société B, que la
      # RLS lui cache pourtant en lecture, et ni `service_role` ni un déclencheur
      # `SECURITY DEFINER` ne s'y opposent : seule une clé composite le fait,
      # parce qu'elle vit dans les DONNÉES. Mesuré avant la 237 : 411 clés de ce
      # type sur 219 tables. Le contrôle refuse la moindre clé mono-colonne et
      # échoue si le relevé ne trouve plus les clés composites.
      - name: Clés étrangères composites (isolation des données)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_composite_fks.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # PERM-01 : la matrice des rôles n'est opposable que si la politique RLS la
      # porte. Avant la 239, un `viewer` créait une facture et supprimait un
      # client par appel direct (7 politiques sur 2 296 regardaient le rôle). La
      # 239 a posé la garde `can_perform` sur les 41 tables du périmètre de la
      # décision `D-6` ; ce contrôle exige la garde sur TOUTES leurs politiques
      # d'écriture, et publie le nombre de tables qui restent sous la garde de
      # société seule — un état daté, jamais silencieux.
      - name: Rôles opposables sur le périmètre sensible
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_roles_opposables.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L2 / G1 — la grille BT (plan d'implémentation des chaînages §4.2). Ce qui
      # manquait aux contrôles de structure : les DEUX moitiés qui n'étaient
      # gardées par rien — RLS activée et FORCÉE, et l'index de société sur les
      # 360 tables qui portent tenant_id. « Une politique par commande » (ISO-03)
      # et les clés composites (ISO-02) restent tenues par les deux contrôles
      # ci-dessus : ce fichier ne les rejoue pas. Les nombres sont ceux du
      # 30/09/2026 sur base neuve (55 sans RLS forcée, 79 sans index de société) :
      # un nombre qui MONTE casse la CI, un nombre qui BAISSE aussi tant que le
      # plafond daté n'est pas réinscrit — un plafond qui ne se met pas à jour ment.
      - name: 'L2 : grille BT — RLS forcée et index de société (G1)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_bt_grid.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L2 / G2 — le contrat d'effet, confronté au réel. Le socle est fermé par
      # défaut (`chain_autorise` rend faux sans déclaration) et AUCUN des 14 effets
      # tracés par L1 n'était déclaré : chaque exécution traçait donc `tolere` puis
      # `applique`. Ce contrôle lit `pg_proc` — pas les fichiers — et exige que tout
      # effet appelé (`chain_avant`, `link_documents`) soit déclaré dans
      # `document_effects` OU inscrit au registre du fichier, qui ne peut que
      # rétrécir (lot L7 = celui qui déclarera). Un maillon neuf sans contrat casse
      # donc la CI, ce que rien ne faisait avant.
      - name: 'L2 : contrat d''effet confronté au code (G2)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_effects_contract.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # ⚠️ LA SUITE 318 EST CÂBLÉE PLUS BAS, AVEC LES AUTRES SUITES — et pas ici.
      # Une suite placée dans cette section s'exécuterait **AVANT** l'étape
      # « Vérifier que les types sont à jour », créerait `_audit_results` (via
      # `ci/audit_helpers.sql`), et ferait entrer ces tables d'outillage dans les
      # types générés : la comparaison échoue. C'est mesuré — la CI l'a dit au
      # premier passage de la 318, le 30/09, avant le merge.

      # G7 — « le socle peut-il écrire ? » La trouvaille de L1 tranche 3 :
      # `FORCE ROW LEVEL SECURITY` s'applique AUSSI au propriétaire, et les tables
      # du socle n'ont qu'UNE politique (la LECTURE) — donc aucune politique
      # d'écriture. Si leur propriétaire n'est ni superutilisateur ni BYPASSRLS,
      # le socle ne peut pas écrire, et `link_documents` non plus (une fonction
      # SECURITY DEFINER s'exécute en tant que son propriétaire). Mesuré le 30/09
      # sur base neuve : 311 tables sous FORCE RLS, dont 12 sans aucune politique
      # d'écriture, dont les six du socle. L'expérience à une seule variable (le
      # propriétaire) donne 42501 pour un rôle nu, et l'écriture pour un rôle
      # BYPASSRLS ou superutilisateur.
      #
      # CE CONTRÔLE A UNE PARTICULARITÉ : la CI ne peut pas voir le défaut (son
      # `postgres` est superutilisateur). Il publie donc le VERDICT DE
      # L'ENVIRONNEMENT et échoue si cet environnement est muet — c'est le
      # diagnostic de la copie de production, en une commande. Les deux nombres
      # sont datés : à la hausse c'est une exposition neuve, à la baisse c'est une
      # amélioration à inscrire dans le même commit (règle du plafond, comme G1).
      - name: 'L1 : le socle peut-il écrire sous RLS forcée ? (G7)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_forced_rls_writers.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # L2 / G6 — le banc des chaînages : 1 000 tours du chemin que tous les
      # maillons partagent (chain_avant, link_documents, emit_domain_event,
      # chain_apres), p95 comparé au budget §3.3 (50 ms pour un maillon simple).
      # Mesuré le 30/09/2026 : p95 total 1,002 ms — et, index d'arbitrage retiré
      # pour l'éprouver, le banc échoue immédiatement. Les limites sont écrites
      # dans l'en-tête (il ne voit pas la perte du seul index d'historique à
      # N = 1 000 : l'échelle réelle est le banc L4, sur copie de production).
      # Le banc se déroule dans une transaction ANNULÉE : il ne laisse rien.
      - name: 'L2 : banc des chaînages — 1 000 tours dans le budget (G6)'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/ci/check_chain_performance.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Générer les types TypeScript depuis PostgreSQL
        run: node scripts/generate-db-types.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: Vérifier que les types sont à jour
        run: |
          if git diff --name-only src/types/database-generated.ts | grep -q .; then
            echo "ERROR: Les types générés diffèrent. Exécutez localement: node scripts/generate-db-types.mjs"
            git diff src/types/database-generated.ts
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      - name: LOT7-04 — Vérifier les colonnes et jointures contre PostgREST
        run: |
          # Les selects Supabase sont des chaînes de caractères : ni tsc ni les tests
          # unitaires (où Supabase est mocké) ne voient une colonne inexistante ou un
          # embed ambigu. Seul un vrai PostgREST les refuse — 19 requêtes cassées ont
          # été trouvées ainsi le 17/09/2026.
          # `--network host` : le service PostgreSQL du job est publié sur localhost.
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:postgres@localhost:5432/test_compta" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=postgres \
            -e PGRST_DB_MAX_ROWS=1000 \
            -e PGRST_SERVER_PORT=3333 \
            postgrest/postgrest:v16.3
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:3333/employees?limit=1" && break
            sleep 2
          done
          curl -sf -o /dev/null "http://localhost:3333/employees?limit=1" || {
            echo "PostgREST n'a pas démarré :"; docker logs pgrst; exit 1; }
          node scripts/check-embeds.mjs
        env:
          PGRST_URL: http://localhost:3333

      # `check-embeds` ne regarde que les LECTURES. Une colonne inexistante dans
      # un `.insert()` / `.update()` n'est vue ni par tsc, ni par les tests
      # (Supabase y est simulé), ni par PostgREST tant que la requête n'est pas
      # jouée : 20 écritures impossibles subsistent, toutes en baseline avec la
      # vague qui les corrige (W6). Une écriture NOUVELLE casse la CI, et une
      # ligne de baseline devenue fausse la casse aussi (plafond qui ne peut que
      # baisser) — sans quoi la baseline se remplirait de dettes périmées.
      - name: W0 — Colonnes écrites confrontées au schéma réel
        run: node scripts/check-written-columns.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # `audit-silent-failures` cherche une déstructuration INCOMPLÈTE
      # (`const { data } = …` sans `error`). Il ne voit pas l'absence TOTALE de
      # déstructuration : 29 écritures (19 instructions) dont l'erreur n'est
      # jamais lue, dont quatre alimentations de la paie.
      - name: W0 — Écritures dont l'erreur n'est jamais lue
        run: node scripts/check-unchecked-writes.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

      # `check-unchecked-writes` voit l'absence de lecture d'erreur, pas le
      # CONTRAT de l'appel. Un `.rpc('nom', { arguments })` faux n'est vu ni par
      # `tsc` (client typé « any »), ni par les tests (Supabase y est simulé), ni
      # par PostgREST tant qu'il n'est pas joué : PostgREST répond 404 pour un nom
      # inconnu, un argument inconnu, une arité incomplète — et jamais pour une
      # fonction `RETURNS trigger`, qu'il n'expose pas. Mesuré le 27/09/2026 :
      # **14 contrats rompus** sur 117 appels, dont 4 fonctions de déclencheur
      # appelées depuis des écrans vivants. La baseline est à ZÉRO (W10) : tout
      # appel nouveau qui ne viserait pas une fonction réelle fait échouer la CI.
      - name: W10 — Appels RPC confrontés aux signatures réelles
        run: node scripts/check-rpc-contract.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_compta

